[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microscope"
version = "0.1.0"
description = "Desktop app for the Wadeo / Geek szitman supercamera USB microscope"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
dependencies = ["pyusb>=1.2", "opencv-python>=4.9", "numpy>=1.26", "PySide6>=6.6"]
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)", "Operating System :: MacOS", "Programming Language :: Python :: 3.12", "Topic :: Scientific/Engineering :: Image Processing"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
microscope = "microscope.__main__:main"

[tool.setuptools.packages.find]
include = ["microscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
